name: Check HKD/CNY rate

on:
  schedule:
    # Every 30 minutes; GitHub may delay scheduled runs. The ECB rate itself changes once per working day.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check rate and notify
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python alert.py --daily
