name: Check HKD/CNY rate

on:
  schedule:
    # 09:00 UTC = 17:00 Hong Kong time; that day's ECB rate is not out yet, so it reports the previous working day.
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check rate and notify
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python alert.py --daily
